name: AI Adoption Report
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: number
jobs:
  ai-adoption:
    uses: vonage-technology/api-ept-ai-forge/.github/workflows/ai-adoption-v2.yml@main
    secrets: inherit

  require-ai-label:
    needs: ai-adoption
    uses: ./.github/workflows/ai-label-scan.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
